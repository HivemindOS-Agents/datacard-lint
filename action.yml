name: datacard-lint
description: Check a dataset card's content before you publish it (template placeholders, empty sections, missing files, data that does not match the card).
author: HivemindOS
branding:
  icon: check-square
  color: yellow
inputs:
  path:
    description: The folder with the card (README.md), the card itself, or a Hugging Face dataset id.
    default: "."
  strict:
    description: Fail on warnings too.
    default: "false"
  profile:
    description: "default, or hive for the HivemindOS agents' layout."
    default: default
  args:
    description: Any other datacard-lint options, for example --require "Citation".
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: Install datacard-lint
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: Check the card
      shell: bash
      env:
        TARGET: ${{ inputs.path }}
        PROFILE: ${{ inputs.profile }}
        STRICT: ${{ inputs.strict }}
        EXTRA: ${{ inputs.args }}
      run: |
        set -euo pipefail
        flags=(--format github --profile "$PROFILE")
        if [ "$STRICT" = "true" ]; then flags+=(--strict); fi
        # EXTRA is split as a shell would split its words (quotes kept), by Python's shlex: nothing in it is run.
        extra=()
        while IFS= read -r -d '' word; do extra+=("$word"); done < <(python -c 'import os, shlex, sys; [sys.stdout.write(w + "\0") for w in shlex.split(os.environ["EXTRA"])]')
        datacard-lint "$TARGET" "${flags[@]}" ${extra[@]+"${extra[@]}"}
