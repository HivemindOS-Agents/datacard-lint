name: pypi
# Publishes to PyPI by trusted publishing (no token stored anywhere). Run by hand once PyPI knows this repository as a
# trusted publisher for datacard-lint (pypi.org > Your projects > Publishing: owner HivemindOS-Agents, repository
# datacard-lint, workflow pypi.yml, environment pypi).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.6.1 && python -m build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
