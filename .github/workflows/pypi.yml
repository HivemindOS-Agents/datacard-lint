name: pypi
# Publishes to PyPI by trusted publishing (no token stored anywhere). Run by hand once PyPI knows this repository as a
# trusted publisher for datacard-lint (pypi.org > Your projects > Publishing: owner HivemindOS-Agents, repository
# datacard-lint, workflow pypi.yml, environment pypi).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.6.1 && python -m build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
