name: published
# The released action, referenced by tag the way another repository's workflow does.
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  released:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: v0.1.0 on a clean card
        uses: HivemindOS-Agents/datacard-lint@2ec092c73fa6ce99b32bb23903ad8cb211c018aa # v0.1.0
        with:
          path: tests/fixtures/clean_card
          strict: "true"
      - name: v0.1.0 on an outside Hub dataset
        uses: HivemindOS-Agents/datacard-lint@2ec092c73fa6ce99b32bb23903ad8cb211c018aa # v0.1.0
        with:
          path: tatsu-lab/alpaca
          args: --no-data
