name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
  action:
    # The action itself, as a stranger's workflow uses it: a clean card passes, a bad one fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: A clean card passes
        uses: ./
        with:
          path: tests/fixtures/clean_card
          strict: "true"
      - name: A card with problems fails
        id: bad
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/template_card
      - name: It did fail
        if: steps.bad.outcome != 'failure'
        run: echo "the bad card passed" && exit 1
      - name: A Hub dataset by id
        uses: ./
        with:
          path: openai/gsm8k
          args: --no-data
